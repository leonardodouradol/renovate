name: Renovate Self-Hosted

on:
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run Renovate
        uses: renovatebot/github-action@v36
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          configFile: renovate.json